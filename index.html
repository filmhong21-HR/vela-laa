    function calculateTenure(startDateStr) {
      const start = new Date(startDateStr);
      const now = new Date();
      let years = now.getFullYear() - start.getFullYear();
      let months = now.getMonth() - start.getMonth();
      let days = now.getDate() - start.getDate();
      if (days < 0) { months--; const prev = new Date(now.getFullYear(), now.getMonth(), 0); days += prev.getDate(); }
      if (months < 0) { years--; months += 12; }
      return `${years} ปี ${months} เดือน ${days} วัน`;
    }

              </div>
              <div class="space-y-4 text-sm leading-relaxed text-justify px-4">
                <p style="text-indent: 40px;">หนังสือฉบับนี้ออกให้เพื่อรับรองว่า <b>${user.name}</b> (รหัสพนักงาน: ${user.id}) เป็นพนักงานประจำของบริษัท ปรีชาสตีลพาร์ท จำกัด ดำรงตำแหน่ง <b>${user.dept}</b> โดยเริ่มปฏิบัติงานตั้งแต่วันที่ ${user.startDate} จนถึงปัจจุบัน</p>
                <p style="text-indent: 40px;">ปัจจุบันได้รับอัตราเงินเดือนรวมสวัสดิการ <b>${user.salary} บาท</b></p>
                <p style="text-indent: 40px;">หนังสือรับรองฉบับนี้ออกให้เพื่อนำไปใช้สำหรับ: <b>${doc.purpose}</b></p>
              </div>
              <div class="pt-16 flex justify-end">
                <div class="text-center space-y-8 w-64">
                  <p class="border-b border-dashed pb-1">(นางสาว กรกนก บุญญา)</p>
                  <p class="font-semibold text-xs">ผู้มีอำนาจลงนามฝ่ายบุคคล (HR Manager)</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function openNewLeaveModal() { state.showNewLeaveModal = true; render(); }
    function closeNewLeaveModal() { state.showNewLeaveModal = false; render(); }
    function openNewDocModal() { state.showNewDocModal = true; render(); }
    function closeNewDocModal() { state.showNewDocModal = false; render(); }
    function openNewAnnouncementModal() { state.showNewAnnouncementModal = true; render(); }
    function closeNewAnnouncementModal() { state.showNewAnnouncementModal = false; render(); }

    function renderNewLeaveModal() {
      return `
        <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
          <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <h3 class="text-lg font-bold">🏖️ ยื่นใบลาใหม่</h3>
            <div class="space-y-3">
              <div><label class="text-xs font-semibold">ประเภทการลา</label><select id="leaveTypeInput" class="w-full mt-1 p-3 rounded-xl border text-sm"><option value="พักร้อน">พักร้อน</option><option value="ลากิจ">ลากิจ</option><option value="ลาป่วย">ลาป่วย</option></select></div>
              <div class="grid grid-cols-2 gap-3">
                <div><label class="text-xs font-semibold">วันที่เริ่มต้น</label><input type="date" id="leaveStartInput" value="2026-10-05" class="w-full mt-1 p-3 rounded-xl border text-sm"></div>
                <div><label class="text-xs font-semibold">วันที่สิ้นสุด</label><input type="date" id="leaveEndInput" value="2026-10-06" class="w-full mt-1 p-3 rounded-xl border text-sm"></div>
              </div>
              <div><label class="text-xs font-semibold">เหตุผลในการลา</label><textarea id="leaveReasonInput" rows="3" placeholder="ระบุเหตุผล..." class="w-full mt-1 p-3 rounded-xl border text-sm"></textarea></div>
            </div>
            <div class="flex justify-end space-x-3 pt-4 border-t">
              <button onclick="closeNewLeaveModal()" class="px-4 py-2 bg-slate-200 rounded-xl text-xs font-bold">ยกเลิก</button>
              <button onclick="submitLeaveRequest()" class="px-4 py-2 bg-brand-accent text-white rounded-xl text-xs font-bold">ยื่นคำขอ</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderNewDocModal() {
      return `
        <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
          <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <h3 class="text-lg font-bold">📄 ยื่นขอหนังสือรับรอง</h3>
            <div class="space-y-3">
              <div><label class="text-xs font-semibold">ประเภทเอกสาร</label><select id="docTypeInput" class="w-full mt-1 p-3 rounded-xl border text-sm"><option value="work_certificate">หนังสือรับรองการทำงาน</option></select></div>
              <div><label class="text-xs font-semibold">วัตถุประสงค์</label><input type="text" id="docPurposeInput" placeholder="เช่น ขอสินเชื่อกับสถาบันการเงินหรือธนาคาร" class="w-full mt-1 p-3 rounded-xl border text-sm"></div>
              <p class="text-[11px] text-amber-600 font-medium">⚠️ ระยะเวลาดำเนินการ 3-5 วันทำการ</p>
            </div>
            <div class="flex justify-end space-x-3 pt-4 border-t">
              <button onclick="closeNewDocModal()" class="px-4 py-2 bg-slate-200 rounded-xl text-xs font-bold">ยกเลิก</button>
              <button onclick="submitDocRequest()" class="px-4 py-2 bg-brand-accent text-white rounded-xl text-xs font-bold">ยืนยันการขอ</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderNewAnnouncementModal() {
      return `
        <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
          <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <h3 class="text-lg font-bold">📢 เพิ่มประกาศบริษัทใหม่</h3>
            <div class="space-y-3">
              <div><label class="text-xs font-semibold">หัวข้อประกาศ</label><input type="text" id="annTitleInput" placeholder="หัวข้อ..." class="w-full mt-1 p-3 rounded-xl border text-sm"></div>
              <div><label class="text-xs font-semibold">เนื้อหาประกาศ</label><textarea id="annContentInput" rows="3" placeholder="รายละเอียด..." class="w-full mt-1 p-3 rounded-xl border text-sm"></textarea></div>
              <div class="flex items-center space-x-2"><input type="checkbox" id="annUrgentInput" class="w-4 h-4"><label class="text-xs font-semibold">ตั้งเป็นประกาศด่วน (Urgent)</label></div>
            </div>
            <div class="flex justify-end space-x-3 pt-4 border-t">
              <button onclick="closeNewAnnouncementModal()" class="px-4 py-2 bg-slate-200 rounded-xl text-xs font-bold">ยกเลิก</button>
              <button onclick="submitAnnouncement()" class="px-4 py-2 bg-brand-accent text-white rounded-xl text-xs font-bold">เผยแพร่ประกาศ</button>
            </div>
          </div>
        </div>
      `;
    }

    function handleLogin() {
      const empId = document.getElementById('loginEmpId').value.trim().toUpperCase();
      const found = usersDb.find(u => u.id === empId);
      if (found) {
        state.currentUser = found;
        state.activeTab = found.role === 'executive' ? 'executive_overview' : 'dashboard';
        render();
      } else {
        alert("ไม่พบรหัสพนักงานนี้ (กรุณาลอง P322 สำหรับ Admin หรือ EMP001 สำหรับพนักงานทั่วไป)");
      }
    }

    function logout() { state.currentUser = null; render(); }
    function switchTab(tab) { state.activeTab = tab; render(); }
    function toggleDarkMode() { state.darkMode = !state.darkMode; render(); }
    function setFontSize(level) { state.fontSizeLevel = level; render(); }
    function toggleIdCardFlip() { state.idCardFlipped = !state.idCardFlipped; render(); }
    function previewOfficialDocument(id) { state.selectedDocForPreview = id; render(); }
    function closeDocumentPreview() { state.selectedDocForPreview = null; render(); }

    function submitLeaveRequest() {
      const type = document.getElementById('leaveTypeInput').value;
      const start = document.getElementById('leaveStartInput').value;
      const end = document.getElementById('leaveEndInput').value;
      const reason = document.getElementById('leaveReasonInput').value;
      state.leaveRequests.unshift({
        id: `LR-20260930-${Math.floor(Math.random()*900+100)}`,
        empId: state.currentUser.id,
        name: state.currentUser.name,
        dept: state.currentUser.dept,
        type: type, startDate: start, endDate: end, days: 2,
        reason: reason || 'ธุระส่วนตัว', status: 'approved', date: '2026-09-30'
      });
      closeNewLeaveModal();
      alert("ยื่นใบลาสำเร็จ!");
    }

    function submitDocRequest() {
      const type = document.getElementById('docTypeInput').value;
      const purpose = document.getElementById('docPurposeInput').value;
      state.docRequests.unshift({
        id: `DOC-20260930-${Math.random().toString(36).substring(2,7).toUpperCase()}`,
        empId: state.currentUser.id,
        name: state.currentUser.name,
        dept: state.currentUser.dept,
        type: type, purpose: purpose || 'ขอสินเชื่อธนาคาร',
        status: 'approved', date: '2026-09-30'
      });
      closeNewDocModal();
      alert("ยื่นขอเอกสารสำเร็จ ระบบสร้างเอกสารทางการให้เรียบร้อย!");
    }

    function submitAnnouncement() {
      const title = document.getElementById('annTitleInput').value;
      const content = document.getElementById('annContentInput').value;
      const urgent = document.getElementById('annUrgentInput').checked;
      if (!title || !content) { alert('กรุณากรอกข้อมูลให้ครบถ้วน'); return; }
      state.announcements.unshift({
        id: Date.now(),
        title: (urgent ? '🚨 ' : '📢 ') + title,
        content: content,
        date: '2026-09-30',
        urgent: urgent
      });
      closeNewAnnouncementModal();
      alert("เพิ่มประกาศบริษัทสำเร็จ!");
    }

    render();
  </script>
</body>
</html>
